server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed files under /assets/ — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always be revalidated so new hashed asset refs are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Runtime config injected at container start by docker/30-configjs.sh.
    # Must not be cached — otherwise CDN serves stale API_BASE_URL after redeploy.
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}
